# Codemagic - بناء iOS تلقائي بدون الحاجة لجهاز Mac
# 1. أنشئ حساباً على https://codemagic.io
# 2. اربط مستودع الكود (GitHub/GitLab/Bitbucket)
# 3. أضف هذا الملف وسيقوم Codemagic بالبناء تلقائياً
# 4. لفِ ملف التطبيق (.ipa) تحتاج تشغيل Signing من الإعدادات

workflows:
  ios-workflow:
    name: iOS Build
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: تنزيل الحزم
        script: |
          flutter pub get
      - name: تحليل الكود
        script: |
          flutter analyze
      - name: تشغيل الاختبارات
        script: |
          flutter test
      - name: بناء iOS بدون توقيع
        script: |
          flutter build ios --release --no-codesign
    artifacts:
      - build/ios/iphoneos/*.ipa
      - build/app/outputs/flutter-apk/*.apk

  android-workflow:
    name: Android Build
    max_build_duration: 45
    environment:
      flutter: stable
    scripts:
      - name: تنزيل الحزم
        script: |
          flutter pub get
      - name: بناء APK
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
